version: v1
items:
- filename: item1-v1
  grupo_evaluacion: evaluacion_general
  prompt: |-
    Analiza exclusivamente el contenido proporcionado y determina si en el texto se reporta la información solicitada.

    Pregunta a responder:
    Se pregunta por la presencia de fiebre y se caracteriza con fecha de inicio, intensidad (grados Celsius) y patrón de evolución.

    Criterios de evaluación:
    - SI: El texto reporta la totalidad de la información solicitada de forma identificable.
    - PARCIAL: El texto reporta solo una parte de la información solicitada.
    - NO: El texto no reporta ninguna de las variables solicitadas.

    La evaluación debe basarse únicamente en la información explíclitamente presente en el contenido. No infieras, supongas ni completes información que no esté reportada.

    Regla de salida:
    Responde exclusivamente con una de estas tres opciones exactas:
    SI
    PARCIAL
    NO

    No proporciones explicaciones, comentarios, justificaciones, texto adicional ni ningún otro contenido, es prohibido crear una respuesta extensa solo espero que responda un SI, NO o PARCIAL, no agregues nada más.

    Contenido a evaluar:
    {contenido}
