# ======================================================================
# Configuración de anonimización de historias clínicas
#
# - Cada entidad define si se anonimiza, por qué etiqueta se reemplaza
#   y (opcional) patrones regex propios. Sin patrones, la detecta
#   spaCy / Presidio (PERSON, LOCATION, PHONE_NUMBER...).
# - Los regex van en bloque literal (|): no hay que escapar las "\".
#   Todos usan (?ix): sin distinción de mayúsculas y modo verbose
#   (los espacios y saltos de línea del regex se ignoran).
# - Se usa [ \t] en lugar de \s para que un patrón no salte de línea
#   y se "coma" los renglones siguientes.
# - Los cambios aplican en la siguiente tarea, sin reiniciar el servidor.
# ======================================================================

version: 1
idioma: es
modelo_spacy: es_core_news_lg
umbral: 0.6   # Score mínimo para considerar una detección

entidades:

  # --------------------------------------------------------------------
  # Personas (spaCy NER + nombres precedidos de título o firma)
  # --------------------------------------------------------------------
  PERSON:
    etiqueta: "<NOMBRE>"
    patrones:
      - nombre: nombre_medico
        score: 0.85
        regex: |
          (?ix)
          \b(?:dr\.?|dra\.?|doctor|doctora|m[eé]dico(?:[ \t]+especialista)?|firmado[ \t]+por)
          [ \t]*[:.\-]?[ \t]+
          [a-záéíóúñ]+(?:[ \t]+[a-záéíóúñ]+){1,3}

  LOCATION:
    etiqueta: "<UBICACION>"
    patrones:
      - nombre: direccion
        score: 0.80
        regex: |
          (?ix)
          (?:direcci[oó]n[ \t]*[:.\-]?[ \t]*)?
          \b(?:calle|clle|carrera|cra|diagonal|diag|transversal|trans|avenida|av)\.?
          [ \t]+\d+[a-z0-9 \t\-#.]*

  PHONE_NUMBER:
    etiqueta: "<TELEFONO>"
    patrones:
      - nombre: telefono_co
        score: 0.90
        regex: |
          (?ix)
          \b(?:tel[eé]fono|tel|cel|celular)
          [ \t]*[:.\-]?[ \t]*
          (?:\+?57[ \t]*)?
          (?:3\d{9}|\d{7})

  # --------------------------------------------------------------------
  # Identificadores (deben contener al menos un dígito, para no
  # confundir "historia clínica" o "registro de signos" con un id)
  # --------------------------------------------------------------------
  CO_DOCUMENT_ID:
    etiqueta: "<ID_DOCUMENTO>"
    patrones:
      - nombre: cedula
        score: 0.90
        regex: |
          (?ix)
          \b(?:cc\.?|c\.c\.?|c[eé]dula)
          [ \t]*(?:no\.?|n[uú]mero)?[ \t]*[:.\-]?[ \t]*
          \d{7,10}

  MEDICAL_LICENSE:
    etiqueta: "<REGISTRO_MEDICO>"
    patrones:
      - nombre: registro_medico
        score: 0.90
        regex: |
          (?ix)
          \b(?:registro(?:[ \t]+m[eé]dico)?|reg\.?|tarjeta[ \t]+profesional)
          [ \t]*(?:no\.?|n[uú]mero)?[ \t]*[:.\-]?[ \t]*
          (?=[a-z/\-]*\d)[a-z0-9/\-]{4,15}

  PATIENT_RECORD_ID:
    etiqueta: "<ID_HISTORIA_CLINICA>"
    patrones:
      - nombre: historia_clinica
        score: 0.90
        regex: |
          (?ix)
          \b(?:historia(?:[ \t]+cl[ií]nica)?|hc|id[ \t]+historia|n[uú]mero[ \t]+de[ \t]+(?:historia|ingreso)|identificador[ \t]+[uú]nico)
          [ \t]*(?:no\.?|n[uú]mero)?[ \t]*[:.\-]?[ \t]*
          (?=[a-z/\-]*\d)[a-z0-9/\-]{1,20}

  # Números de 7 a 10 dígitos sueltos. Ojo: puede dar falsos positivos.
  IDENTIFIER_NUMBER:
    etiqueta: "<ID_NUMERICO>"
    patrones:
      - nombre: id_numerico
        score: 0.70
        regex: |
          (?x)
          (?<!\d)\d{7,10}(?!\d)

  # --------------------------------------------------------------------
  # Organizaciones
  # --------------------------------------------------------------------
  # "clínica" también es adjetivo ("historia clínica", "evolución clínica"):
  # solo cuenta como institución si no va precedida de esas palabras.
  HEALTHCARE_ORG:
    etiqueta: "<INSTITUCION_SALUD>"
    patrones:
      - nombre: institucion_salud
        score: 0.80
        regex: |
          (?ix)
          (?<!historia[ \t])(?<!evoluci[oó]n[ \t])(?<!impresi[oó]n[ \t])
          \b(?:cl[ií]nica|hospital|ips|centro[ \t]+m[eé]dico|instituto|unidad[ \t]+hospitalaria|fundaci[oó]n)
          [ \t]+[a-záéíóúñ0-9]+(?:[ \t]+[a-záéíóúñ0-9]+){0,6}

  INSURANCE_ORG:
    etiqueta: "<ASEGURADORA>"
    patrones:
      - nombre: eps
        score: 0.80
        regex: |
          (?ix)
          \b(?:responsable|eps|aseguradora)
          [ \t]*[:.\-]?[ \t]*
          [a-záéíóúñ0-9]+(?:[ \t]+[a-záéíóúñ0-9]+){0,5}

  # --------------------------------------------------------------------
  # Fechas: SOLO la de nacimiento. Las fechas clínicas se conservan
  # (por eso DATE_TIME de Presidio no está en esta lista).
  # --------------------------------------------------------------------
  BIRTH_DATE:
    etiqueta: "<FECHA_NACIMIENTO>"
    patrones:
      - nombre: fecha_nacimiento
        score: 0.95
        regex: |
          (?ix)
          \b(?:fecha[ \t]+(?:y[ \t]+hora[ \t]+)?de[ \t]+)?nacimiento
          [ \t]*(?:\([^)\n]*\))?            # p. ej. "(dd/mm/aaaa hh:mm)"
          [ \t]*[:.\-]?[ \t]*
          \d{1,2}[/\-]\d{1,2}[/\-]\d{2,4}
          (?:[ \t]+\d{1,2}:\d{2}(?::\d{2})?)?

  # --------------------------------------------------------------------
  # Se detectan pero se CONSERVAN (datos clínicos útiles)
  # --------------------------------------------------------------------
  AGE:
    anonimizar: false
    patrones:
      - nombre: edad
        score: 0.85
        regex: |
          (?ix)
          (?:edad(?:[ \t]+al[ \t]+diagn[oó]stico)?[ \t]*[:.\-]?[ \t]*)?
          \d{1,3}[ \t]*a[nñ]os
          (?:[ \t]+y[ \t]+\d{1,2}[ \t]+mes(?:es)?)?

  TIME_ONLY:
    anonimizar: false
    patrones:
      - nombre: hora
        score: 0.95
        regex: |
          (?x)
          (?<!\d)(?:[01]?\d|2[0-3]):[0-5]\d(?::[0-5]\d)?(?!\d)
