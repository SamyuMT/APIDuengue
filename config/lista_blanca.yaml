# ======================================================================
# Lista blanca semántica para el filtrado de historias clínicas (GPC dengue)
#
# categoria -> subcategoria -> términos.
# - Cada subcategoría se convierte en UN concepto: sus términos se unen
#   con ", " y se genera un solo embedding.
# - Una oración se asigna a una subcategoría si su similitud coseno con
#   el concepto es >= umbral. Una oración puede caer en varias.
# - Las categorías (primer nivel) son las claves de la salida filtrada.
# - Los cambios aplican en la siguiente tarea, sin reiniciar el servidor.
# ======================================================================

